<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>我的课表</title>
<meta name="theme-color" content="#3d6df2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="课表">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="css/style.css?v=6">
</head>
<body>
<header class="topbar" id="topbar">
  <div class="topbar-main">
    <div class="app-title" id="appTitle">我的课表</div>
    <div class="term-label" id="termLabel"></div>
  </div>
  <div class="topbar-actions">
    <button class="btn-icon" id="btnToday" title="回到今天">今</button>
    <button class="btn-icon" id="btnPrev" title="上一周">‹</button>
    <button class="btn-icon" id="btnNext" title="下一周">›</button>
  </div>
</header>

<main class="content">
  <!-- 视图1：今天 -->
  <section class="view" id="view-today">
    <div class="today-head">
      <div class="date-chip" id="todayDate">—</div>
      <div class="week-chip" id="todayWeek">—</div>
    </div>
    <div id="todayNext" class="next-banner hidden"></div>
    <div id="todayList" class="card-list"></div>
    <div id="tomorrowBlock"></div>
  </section>

  <!-- 视图2：本周课表 -->
  <section class="view hidden" id="view-week">
    <div class="week-head">
      <div class="week-title" id="weekTitle">—</div>
      <div class="week-sub" id="weekSub"></div>
    </div>
    <div class="grid-scroll" id="gridScroll">
      <div class="grid-wrap" id="gridWrap"></div>
    </div>
    <div class="legend" id="legend"></div>
    <button id="fabCustom" class="fab" title="我的自定义活动">＋</button>
  </section>
  <div class="sheet-wrap hidden" id="customSheet">
    <div class="sheet-backdrop" id="sheetBackdrop"></div>
    <div class="sheet">
      <div class="sheet-head"><b>☆ 我的自定义活动</b><button id="btnCloseSheet" title="关闭">✕</button></div>
      <p class="hint">只存在你自己手机的本地，别人看不到。可添加"踢足球"等个人活动。</p>
      <div class="custom-form">
        <label class="field" style="grid-column:1/-1">活动名称
          <input type="text" id="cusTitle" placeholder="如：踢足球、社团例会">
        </label>
        <label class="field">星期
          <select id="cusDay">
            <option value="1">周一</option><option value="2">周二</option><option value="3">周三</option>
            <option value="4">周四</option><option value="5">周五</option><option value="6">周六</option><option value="7">周日</option>
          </select>
        </label>
        <label class="field">节次
          <span style="display:flex;gap:6px;align-items:center">
            <select id="cusStart" style="flex:1"><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option><option value="6">6</option><option value="7">7</option><option value="8">8</option><option value="9">9</option><option value="10">10</option></select>
            <span>—</span>
            <select id="cusEnd" style="flex:1"><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option><option value="6">6</option><option value="7">7</option><option value="8">8</option><option value="9">9</option><option value="10">10</option></select>
            <span>节</span>
          </span>
        </label>
        <label class="field" style="grid-column:1/-1">周次（选填：默认每周。可写 10 / 5-8 / 单周 / 双周）
          <input type="text" id="cusWeeks" placeholder="留空=每周都有">
        </label>
        <label class="field" style="grid-column:1/-1">备注（选填）
          <input type="text" id="cusNote" placeholder="如：操场东侧 / 带球鞋">
        </label>
        <button class="btn" id="btnAddCustom" style="grid-column:1/-1">＋ 添加活动</button>
      </div>
      <div id="customList"></div>
    </div>
  </div>

  <!-- 视图3：说明与设置 -->
  <section class="view hidden" id="view-about">
    <div class="panel" id="statPanel"></div>
    <div class="panel">
      <div class="panel-title">学期设置</div>
      <label class="field">第 1 周周一日期
        <input type="date" id="setStartDate">
      </label>
      <label class="field">当前显示周数（0 = 自动按日期计算）
        <input type="number" id="setWeek" min="0" max="40" step="1">
      </label>
      <label class="field toggle"><span>课表显示周六、周日</span>
        <input type="checkbox" id="setShowWeekend" checked>
      </label>
      <button class="btn" id="btnSave">保存设置</button>
      <button class="btn ghost" id="btnReset">恢复默认设置</button>
    </div>
    <div class="panel">
      <div class="panel-title">分享与使用</div>
      <p>把本页网址发给同学，大家都能打开查看。手机上可在浏览器菜单中选
        <b>「添加到主屏幕」</b>，之后像 App 一样点开。</p>
      <p>数据保存在 <code>js/schedule-data.js</code>，改课表只动那一个文件。</p>
      <p><b>当前版本：v6</b> — 若你/朋友看到的还是旧界面，请<b>下拉刷新</b>或<b>清除浏览器缓存</b>后重进。</p>
    </div>
  </section>
</main>

<nav class="tabbar">
  <button class="tab active" data-view="today">
    <span class="tab-icon">◷</span><span>今天</span></button>
  <button class="tab" data-view="week">
    <span class="tab-icon">▦</span><span>本周</span></button>
  <button class="tab" data-view="about">
    <span class="tab-icon">⚙</span><span>设置</span></button>
</nav>

<script src="js/core.js?v=6"></script>
<script src="js/schedule-data.js?v=6"></script>
<script src="js/app.js?v=6"></script>
</body>
</html>
